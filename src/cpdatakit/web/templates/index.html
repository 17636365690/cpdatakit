<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPDataKit local workbench · 本地科研数据工作台</title>
  <link rel="icon" href="data:,"><link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script type="module" src="{{ url_for('static', path='app.js') }}"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/">CPDataKit</a></header>
  <main class="page home">
    <h1>项目</h1>
    <form class="create-form" method="post" action="/api/projects"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="project-name">项目名称</label><input id="project-name" name="name" required maxlength="200" placeholder="例如：拉伸实验数据检查"><button type="submit" class="primary">创建项目</button></form>
    <p id="home-error" class="error" role="alert"></p>
    <ul class="project-list" aria-label="我的项目">{% for project in projects %}<li data-project-id="{{ project.id }}"><a href="/projects/{{ project.id }}">{{ project.name }}</a></li>{% else %}<li class="empty-state">还没有项目。</li>{% endfor %}</ul>
    <p class="note">文件与结果保存在本机工作区。</p>
  </main>
</body>
</html>
