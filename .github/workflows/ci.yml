name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  macos-wheel-smoke:
    name: macOS clean-wheel smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build
      - run: python -m build --wheel --outdir dist
      - run: python -m venv wheel-env
      - run: wheel-env/bin/python -m pip install dist/*.whl
      - run: wheel-env/bin/cpdatakit --version
      - run: wheel-env/bin/python -c "import cpdatakit; print(cpdatakit.__version__)"
      - run: wheel-env/bin/cpdatakit ui --no-browser --help
      - run: wheel-env/bin/python -c "from cpdatakit.web import create_app; print(create_app('ui-smoke').title)"

  minimum-dependencies:
    name: Minimum supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lower-bound runtime and test dependencies
        run: |
          python -m pip install \
            "numpy>=2.0,<3" \
            "pandas>=2.2,<3" \
            "h5py>=3.8,<4" \
            "matplotlib>=3.7" \
            "pint>=0.22" \
            "xarray>=2026.7,<2027" \
            "zarr>=3.1,<4" \
            "pyarrow>=25,<26" \
            "h5netcdf>=1.5,<2" \
            "netCDF4>=1.7,<2" \
            "fastapi>=0.141,<1" \
            "uvicorn>=0.35,<1" \
            "Jinja2>=3.1,<4" \
            "python-multipart>=0.0.20,<1" \
            "pytest>=7.4" \
            "pytest-cov>=4.1" \
            "hypothesis>=6.100" \
            "httpx>=0.28,<1"
      - run: python -m pip install -e . --no-deps
      - run: pytest

  quality-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Set reproducible build timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov=cpdatakit --cov-report=term-missing --cov-fail-under=85
      - run: ruff check .
      - run: ruff format --check .
      - name: Verify current release metadata
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/check_release.py "v${version}"
      - name: Build reproducible distributions
        shell: bash
        run: |
          rm -rf dist
          mkdir -p dist/repro-a dist/repro-b
          python -m build --outdir dist/repro-a
          python -m build --outdir dist/repro-b
          python scripts/check_reproducible_build.py dist/repro-a dist/repro-b
          cp dist/repro-a/* dist/
          rm -rf dist/repro-a dist/repro-b
      - name: Verify current distributions
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/check_release.py "v${version}" --dist-dir dist
      - run: python -m twine check dist/*
      - name: Install wheel and smoke test
        shell: bash
        run: |
          python -m venv wheel-env
          wheel-env/bin/python -m pip install dist/*.whl
          wheel-env/bin/cpdatakit --version
          wheel-env/bin/python -c "import cpdatakit; print(cpdatakit.__version__)"
          wheel-env/bin/cpdatakit ui --no-browser --help
          wheel-env/bin/python -c "from cpdatakit.web import create_app; print(create_app('ui-smoke').title)"
          wheel-env/bin/python -c "from cpdatakit import load_hdf5, iter_hdf5_chunks; print('HDF5 APIs available')"
          wheel-env/bin/python -c "from cpdatakit.samples import generate_sample_data; generate_sample_data('quickstart-smoke')"
          wheel-env/bin/cpdatakit validate quickstart-smoke/synthetic_curve.csv --schema curve --json-output validation.json
          wheel-env/bin/cpdatakit summary quickstart-smoke/synthetic_curve.csv --schema curve --json-output summary.json
          wheel-env/bin/cpdatakit convert quickstart-smoke/synthetic_curve.csv --schema curve --output curve.h5 --source-description "Fixed-seed CI quickstart"
          wheel-env/bin/cpdatakit plot curve.h5 --schema curve --kind stress-strain --output stress-strain.png
          wheel-env/bin/cpdatakit validate examples/thermal-cycle/input/thermal-cycle.csv --schema examples/thermal-cycle/schema/thermal-cycle.json --mapping examples/thermal-cycle/mappings/thermal-cycle.json --json-output thermal-validation.json
          wheel-env/bin/cpdatakit convert examples/thermal-cycle/input/thermal-cycle.csv --schema examples/thermal-cycle/schema/thermal-cycle.json --mapping examples/thermal-cycle/mappings/thermal-cycle.json --output thermal-cycle.h5
          wheel-env/bin/cpdatakit plot thermal-cycle.h5 --schema examples/thermal-cycle/schema/thermal-cycle.json --kind xy --x time --y temperature --output temperature-vs-time.png

